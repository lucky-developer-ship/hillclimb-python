name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -qq -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            gettext \
            git \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtinfo5 \
            libtool \
            openjdk-17-jdk-headless \
            patch \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev \
            python3-pip \
            python3-dev \
            python3-venv

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer cython virtualenv appdirs packaging colorama jinja2 toml build

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug 2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hillclimb-apk
          path: bin/*.apk
          if-no-files-found: error
